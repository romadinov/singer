# iPhone app. Generate the Xcode project with `xcodegen` (the Mac app builds with SwiftPM).
name: SingerPhone
options:
  bundleIdPrefix: com.romadinov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: SZVSSCJQFN

targets:
  SingerPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: Singer
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.singer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Singer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: Singer looks for your Mac on Wi-Fi to sync music and audiobook positions.
        NSBonjourServices: [_singer._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, com.apple.m4a-audio, com.apple.protected-mpeg-4-audio-b, org.xiph.flac, com.microsoft.waveform-audio, public.aiff-audio]
